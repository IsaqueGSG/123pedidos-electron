<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atualizando o Sistema</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag; /* Permite arrastar se necessário, mas a janela não tem frame */
    }
    .container {
      text-align: center;
      padding: 24px;
      width: 100%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2 id="title">Atualizando o sistema...</h2>
    <p id="subtitle">Baixando nova versão. Não feche o aplicativo.</p>
  </div>

  <script>
    // Ouve os eventos enviados pelo processo principal via IPC para atualizar a UI
    window.addEventListener('DOMContentLoaded', () => {
      window.electronAPI.onUpdateMessage((data) => {
        const titleEl = document.getElementById('title');
        const subtitleEl = document.getElementById('subtitle');

        if (data.status === 'downloading') {
          titleEl.innerText = "Baixando atualização...";
          subtitleEl.innerText = `Versão ${data.version || ''} encontrada`;
        } else if (data.status === 'installing') {
          titleEl.innerText = "Instalando atualização...";
          subtitleEl.innerText = "O app será reiniciado em instantes.";
          document.querySelector('.spinner').style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
